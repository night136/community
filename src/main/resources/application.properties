server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.zfx.community.model
mybatis.mapper-locations=classpath:mapper/*.xml

# Logging
logging.file=logs/community.log
logging.level.com.zfx=info
logging.file.max-history=15
logging.file.max-size=100MB

# Session
server.servlet.session.timeout=${SESSION_TIMEOUT:15552000}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# GitHub OAuth
github.client.id=${GITHUB_CLIENT_ID:}
github.client.secret=${GITHUB_CLIENT_SECRET:}
github.redirect.uri=${GITHUB_REDIRECT_URI:http://localhost:8080/callback}
